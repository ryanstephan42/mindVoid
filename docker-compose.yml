services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./test.db
    networks:
      - budget_budget-network

  frontend:
    build: ./frontend
    ports:
      - "3003:3003"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - budget_budget-network

networks:
  budget_budget-network:
    external: true
