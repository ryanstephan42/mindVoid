services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/mindvoid.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3003,http://127.0.0.1:3003}
      MINDVOID_PASSWORD: ${MINDVOID_PASSWORD:-}
      MINDVOID_SECRET: ${MINDVOID_SECRET:-}
      MINDVOID_TOKEN_TTL_HOURS: ${MINDVOID_TOKEN_TTL_HOURS:-720}

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3003:3003"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1,dump.stephanfamily.com}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
    depends_on:
      - backend

volumes:
  backend_data:
